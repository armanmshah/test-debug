[project]
name = "shopkit"
version = "0.3.0"
description = "A tiny store toolkit: catalog, cart, pricing, inventory and shipping estimates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shopkit = "shopkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
